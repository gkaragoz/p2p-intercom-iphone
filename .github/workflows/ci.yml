name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests-linux:
    name: Core unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run IntercomCore tests
        run: swift test --parallel

  ios-build:
    name: iOS app build (Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Core unit tests (macOS)
        run: swift test --parallel
      # Builds through the shared scheme, which is what the README's command-line install
      # recipe uses, so a broken scheme fails CI instead of the user's Mac.
      - name: Build Intercom for the iOS Simulator
        run: |
          xcodebuild \
            -project Intercom.xcodeproj \
            -scheme Intercom \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Check the shared scheme is visible to xcodebuild
        run: xcodebuild -project Intercom.xcodeproj -list
