name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running checks for the older commit pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-linux:
    name: Core unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # Intercom/Core must stay Foundation-only; this job is what proves it.
      - name: Run IntercomCore tests
        run: swift test --parallel

  ios-build:
    name: iOS app and Live Activity extension
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Core unit tests (macOS)
        run: swift test --parallel

      # The README's install recipes use both shared schemes and the Phone 2 configurations, and
      # xcodebuild silently invents schemes when shared ones are missing, so check them explicitly.
      - name: Check targets, configurations and shared schemes
        run: |
          xcodebuild -project Intercom.xcodeproj -list
          xcodebuild -project Intercom.xcodeproj -list -json > "$RUNNER_TEMP/list.json"
          python3 - "$RUNNER_TEMP/list.json" <<'EOF'
          import json, sys
          project = json.load(open(sys.argv[1]))["project"]
          expected = {
              "targets": {"Intercom", "IntercomLiveActivityExtension"},
              "configurations": {"Debug", "Release", "Debug-Phone2", "Release-Phone2"},
              "schemes": {"Intercom", "Intercom (Phone 2)"},
          }
          ok = True
          for key, names in expected.items():
              actual = set(project.get(key, []))
              if actual != names:
                  ok = False
                  print(f"::error::{key}: expected {sorted(names)}, got {sorted(actual)}")
          sys.exit(0 if ok else 1)
          EOF

      # Every user-visible string ships in English and Turkish, in the app and in the extension.
      - name: Check Turkish translations in the string catalogs
        run: |
          python3 - Intercom/Resources/Localizable.xcstrings Intercom/Resources/InfoPlist.xcstrings \
            IntercomLiveActivity/Localizable.xcstrings <<'EOF'
          import json, re, sys
          spec = re.compile(r"%(?:\d+\$)?(?:lld|ld|llu|lu|d|u|@|\.?\d*f)")
          def specifiers(text):
              return sorted(re.sub(r"\d+\$", "", m) for m in spec.findall(text))
          ok = True
          for path in sys.argv[1:]:
              strings = json.load(open(path))["strings"]
              for key, entry in strings.items():
                  if entry.get("shouldTranslate") is False:
                      continue
                  unit = entry.get("localizations", {}).get("tr", {}).get("stringUnit", {})
                  value = unit.get("value", "")
                  if not value or unit.get("state") != "translated":
                      ok = False
                      print(f"::error file={path}::missing Turkish translation for {key!r}")
                  elif specifiers(value) != specifiers(key):
                      ok = False
                      print(f"::error file={path}::format specifiers differ for {key!r}: {value!r}")
              print(f"{path}: {len(strings)} keys checked")
          sys.exit(0 if ok else 1)
          EOF

      - name: Build Intercom for the iOS Simulator (scheme Intercom, Debug)
        run: |
          xcodebuild \
            -project Intercom.xcodeproj \
            -scheme Intercom \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      # The catalogs are maintained by hand (extractionState manual) and xcodebuild never adds new
      # keys to them, so the Turkish check above cannot see a string that only exists in code. The
      # compiler's extracted .stringsdata can: every key it lists must be in the target's catalog.
      - name: Check every string used in code is in its catalog
        run: |
          python3 - build/dd-sim/Build/Intermediates.noindex/Intercom.build/Debug-iphonesimulator <<'EOF'
          import glob, json, os, sys
          intermediates = sys.argv[1]
          targets = {
              "Intercom": "Intercom/Resources/Localizable.xcstrings",
              "IntercomLiveActivityExtension": "IntercomLiveActivity/Localizable.xcstrings",
          }
          ok = True
          for target, catalog in targets.items():
              files = glob.glob(f"{intermediates}/{target}.build/Objects-normal/*/*.stringsdata")
              if not files:
                  print(f"::error::no .stringsdata found for {target} under {intermediates}")
                  ok = False
                  continue
              used = {}  # key -> source files; architectures deduplicated by the dict
              for path in files:
                  data = json.load(open(path))
                  source = data.get("source", "")
                  if not os.path.exists(source):
                      continue
                  for table, entries in data.get("tables", {}).items():
                      if table != "Localizable":
                          ok = False
                          print(f"::error file={source}::strings table {table!r} is not shipped; use Localizable")
                          continue
                      for entry in entries:
                          used.setdefault(entry["key"], set()).add(os.path.relpath(source))
              keys = set(json.load(open(catalog))["strings"])
              for key in sorted(set(used) - keys):
                  ok = False
                  sources = ", ".join(sorted(used[key]))
                  print(f"::error file={catalog}::{key!r} used in {sources} but missing from the catalog")
              print(f"{target}: {len(used)} extracted keys, all in {catalog}" if used.keys() <= keys
                    else f"{target}: {len(set(used) - keys)} of {len(used)} extracted keys missing from {catalog}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Build Intercom for iOS devices, unsigned (scheme Intercom (Phone 2), Release-Phone2)
        run: |
          xcodebuild \
            -project Intercom.xcodeproj \
            -scheme 'Intercom (Phone 2)' \
            -configuration Release-Phone2 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-dev \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      # A Live Activity extension that is built but not embedded (or embedded with a bundle id the
      # app does not prefix) compiles fine and only fails on the phone, so check the products.
      - name: Check the Live Activity extension is embedded
        run: |
          set -euo pipefail
          check() {
            app="$1"
            appex="$app/PlugIns/IntercomLiveActivityExtension.appex"
            echo "== $app"
            test -d "$app" || { echo "::error::$app was not built"; exit 1; }
            test -d "$appex" || { echo "::error::$appex is not embedded"; exit 1; }
            point=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$appex/Info.plist")
            test "$point" = "com.apple.widgetkit-extension" \
              || { echo "::error::unexpected extension point $point"; exit 1; }
            app_id=$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")
            appex_id=$(plutil -extract CFBundleIdentifier raw -o - "$appex/Info.plist")
            test "$appex_id" = "$app_id.LiveActivity" \
              || { echo "::error::extension bundle id $appex_id is not $app_id.LiveActivity"; exit 1; }
            live=$(plutil -extract NSSupportsLiveActivities raw -o - "$app/Info.plist")
            test "$live" = "true" || { echo "::error::NSSupportsLiveActivities is $live"; exit 1; }
            services=$(plutil -extract NSBonjourServices json -o - "$app/Info.plist")
            case "$services" in
              *'"_intercom-nw._udp"'*) ;;
              *) echo "::error::_intercom-nw._udp missing from NSBonjourServices: $services"; exit 1 ;;
            esac
            modes=$(plutil -extract UIBackgroundModes json -o - "$app/Info.plist")
            case "$modes" in
              *'"audio"'*) ;;
              *) echo "::error::audio background mode missing: $modes"; exit 1 ;;
            esac
            echo "   $app_id embeds $appex_id ($point)"
          }
          check build/dd-sim/Build/Products/Debug-iphonesimulator/Intercom.app
          check build/dd-dev/Build/Products/Release-Phone2-iphoneos/Intercom.app
